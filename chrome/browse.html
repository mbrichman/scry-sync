<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scry Sync — Conversations</title>
  <style>
    :root {
      --bg-body: #f6f7f9;
      --bg-card: #ffffff;
      --text-primary: #2c313a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --border-color: #e2e4e9;
      --border-light: #f0f0f0;
      --primary-color: #5d44e8;
      --primary-hover: #4a35ba;
      --secondary-bg: #f8f9fa;
      --hover-bg: #f8f9fa;
      --input-border: #dddddd;
      --input-focus: #5d44e8;
      --shadow-sm: rgba(0,0,0,0.05);
      --shadow-md: rgba(0,0,0,0.15);
      --error-color: #d32f2f;
      --disabled-bg: #cccccc;
      --disabled-text: #999999;
      --toast-bg: #333333;
      --modal-overlay: rgba(0,0,0,0.5);
      --progress-bg: #e0e0e0;
      --cancel-btn: #dc3545;
      --link-hover: #5d44e8;
      --badge-default: #1d4ed8;
      --badge-sonnet: #ce5c04;
      --badge-haiku: #09923b;
      --badge-opus: #7c3aed;
      --ok-color: #22c55e;
      --warn-color: #d97706;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-body: #121212;
        --bg-card: #1e1e1e;
        --text-primary: #e0e0e0;
        --text-secondary: #b0b0b0;
        --text-muted: #808080;
        --border-color: #2a2a2a;
        --border-light: #333333;
        --primary-color: #6b52e8;
        --primary-hover: #7d66f0;
        --secondary-bg: #2a2a2a;
        --hover-bg: #2a2a2a;
        --input-border: #3a3a3a;
        --input-focus: #8b7aff;
        --shadow-sm: rgba(0,0,0,0.3);
        --shadow-md: rgba(0,0,0,0.5);
        --error-color: #ff6b6b;
        --disabled-bg: #3a3a3a;
        --disabled-text: #666666;
        --toast-bg: #2a2a2a;
        --modal-overlay: rgba(0,0,0,0.7);
        --progress-bg: #3a3a3a;
        --cancel-btn: #e74c3c;
        --link-hover: #8b7aff;
        --badge-default: #7ab8f5;
        --badge-sonnet: #ffaa66;
        --badge-haiku: #66cc66;
        --badge-opus: #c084cc;
        --ok-color: #4ade80;
        --warn-color: #fbbf24;
      }
    }

    :root[data-theme="dark"] {
      --bg-body: #121212;
      --bg-card: #1e1e1e;
      --text-primary: #e0e0e0;
      --text-secondary: #b0b0b0;
      --text-muted: #808080;
      --border-color: #2a2a2a;
      --border-light: #333333;
      --primary-color: #6b52e8;
      --primary-hover: #7d66f0;
      --secondary-bg: #2a2a2a;
      --hover-bg: #2a2a2a;
      --input-border: #3a3a3a;
      --input-focus: #8b7aff;
      --shadow-sm: rgba(0,0,0,0.3);
      --shadow-md: rgba(0,0,0,0.5);
      --error-color: #ff6b6b;
      --disabled-bg: #3a3a3a;
      --disabled-text: #666666;
      --toast-bg: #2a2a2a;
      --modal-overlay: rgba(0,0,0,0.7);
      --progress-bg: #3a3a3a;
      --cancel-btn: #e74c3c;
      --link-hover: #8b7aff;
      --badge-default: #7ab8f5;
      --badge-sonnet: #ffaa66;
      --badge-haiku: #66cc66;
      --badge-opus: #c084cc;
      --ok-color: #4ade80;
      --warn-color: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.6;
      /* Keep the table fully visible at all times. When the viewport is
         narrower than this, the PAGE scrolls horizontally instead of the
         table shrinking or being clipped. */
      min-width: 1000px;
    }

    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 4px var(--shadow-sm);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 20px;
      margin-bottom: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .header-left h1 {
      color: var(--primary-color);
      margin: 0;
      font-size: 20px;
    }

    .settings-wrapper {
      position: relative;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: color 0.2s;
      border-radius: 50%;
    }

    .settings-btn:hover {
      color: var(--primary-color);
      background: var(--secondary-bg);
    }

    .settings-btn svg {
      width: 24px;
      height: 24px;
    }

    .settings-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 16px var(--shadow-md);
      min-width: 240px;
      z-index: 1000;
      padding: 4px 0;
    }

    .settings-dropdown.open {
      display: block;
    }

    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 13px;
      color: var(--text-primary);
    }

    .settings-item:hover {
      background: var(--secondary-bg);
    }

    .settings-label {
      font-weight: 500;
    }

    .settings-value {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .settings-org-id {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
      font-size: 11px;
    }

    .settings-divider {
      height: 1px;
      background: var(--border-color);
      margin: 4px 0;
    }

    .settings-item-has-submenu {
      position: relative;
    }

    .settings-submenu {
      display: none;
      position: absolute;
      top: -1px;
      left: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 16px var(--shadow-md);
      min-width: 140px;
      z-index: 1001;
      padding: 4px 0;
    }

    .settings-item-has-submenu:hover .settings-submenu {
      display: block;
    }

    /* --- Scry connection indicator --- */
    .conn-status {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .conn-dot {
      font-size: 10px;
      color: var(--disabled-text);
      line-height: 1;
    }
    .conn-dot.connected { color: var(--ok-color); }

    /* --- source tabs --- */
    .source-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }
    .source-tab {
      background: var(--secondary-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .source-tab:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }
    .source-tab.active {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: #fff;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
    }

    .search-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-grow: 1;
      max-width: 540px;
    }

    .search-box {
      flex-grow: 1;
      max-width: 500px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 40px 10px 15px;
      border: 1px solid var(--input-border);
      border-radius: 25px;
      font-size: 14px;
      transition: border-color 0.2s;
      background-color: var(--bg-card);
      color: var(--text-primary);
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(107, 82, 232, 0.15);
    }

    .search-box .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px;
      display: none;
    }

    .search-box.has-text .clear-btn {
      display: block;
    }

    .filter-wrapper {
      position: relative;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--input-border);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      position: relative;
      flex-shrink: 0;
    }

    .filter-btn:hover {
      color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .filter-btn.active {
      color: var(--primary-color);
      border-color: var(--primary-color);
      background: var(--secondary-bg);
    }

    .filter-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 16px var(--shadow-md);
      min-width: 200px;
      z-index: 1000;
      padding: 4px 0;
    }

    .filter-dropdown.open {
      display: block;
    }

    .filter-option {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-primary);
      transition: background 0.15s;
    }

    .filter-option:hover {
      background: var(--secondary-bg);
    }

    .filter-option.selected {
      color: var(--primary-color);
      font-weight: 600;
    }

    .stats {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .action-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .action-btn {
      padding: 9px 16px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: var(--primary-hover);
    }

    .action-btn:disabled {
      background: var(--disabled-bg);
      color: var(--disabled-text);
      cursor: not-allowed;
    }

    .action-btn.danger {
      background: var(--cancel-btn);
    }

    .container {
      max-width: 1600px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .conversations-table {
      background: var(--bg-card);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px var(--shadow-sm);
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    thead {
      background: var(--secondary-bg);
      border-bottom: 3px solid var(--bg-body);
    }

    th {
      padding: 15px;
      padding-right: 25px;
      text-align: left;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      position: relative;
      white-space: nowrap;
    }

    th.sortable:hover {
      background: var(--hover-bg);
    }

    .sort-indicator {
      margin-left: 5px;
      color: var(--primary-color);
      font-size: 14px;
      font-weight: normal;
    }

    .sort-indicator sub {
      font-size: 10px;
      margin-left: 1px;
    }

    tbody tr {
      border-bottom: 1px solid var(--border-light);
      transition: background 0.1s;
    }

    tbody tr:hover {
      background: var(--hover-bg);
    }

    td {
      padding: 15px 20px;
      font-size: 14px;
    }

    .conversation-name {
      font-weight: 500;
      color: var(--text-primary);
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .conversation-name a {
      color: inherit;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-name a:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }

    .date {
      color: var(--text-secondary);
      white-space: nowrap;
      line-height: 1.4;
    }

    .synced-badge {
      font-size: 13px;
      white-space: nowrap;
      font-weight: 500;
    }
    .synced-badge.synced { color: var(--ok-color); }
    .synced-badge.stale { color: var(--warn-color); }
    .synced-badge.missing { color: var(--text-muted); }
    .synced-badge.unknown { color: var(--text-muted); }

    .model-badge {
      display: inline-block;
      padding: 3px 0;
      font-size: 12px;
      font-weight: 500;
      background: transparent;
      color: var(--badge-default);
      white-space: nowrap;
    }

    .model-badge.sonnet { color: var(--badge-sonnet); }
    .model-badge.haiku { color: var(--badge-haiku); }
    .model-badge.opus { color: var(--badge-opus); }

    .model-bounced {
      margin-left: 4px;
      font-size: 12px;
      color: var(--badge-default);
    }
    .model-bounced.sonnet { color: var(--badge-sonnet); }
    .model-bounced.haiku  { color: var(--badge-haiku); }
    .model-bounced.opus   { color: var(--badge-opus); }

    .model-cell {
      display: inline-block;
      cursor: help;
    }

    .model-none {
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .checkbox-col {
      width: 50px;
      text-align: right;
      padding: 15px 25px !important;
      vertical-align: middle;
    }

    .checkbox-col input[type="checkbox"] {
      cursor: pointer;
      width: 18px;
      height: 18px;
      vertical-align: middle;
      margin: 0;
    }

    .btn-small {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      background: var(--primary-color);
      color: white;
    }

    .btn-small:hover {
      background: var(--primary-hover);
    }

    .btn-small:disabled {
      background: var(--disabled-bg);
      color: var(--disabled-text);
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .error {
      text-align: center;
      padding: 40px;
      color: var(--error-color);
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid var(--border-light);
      border-top: 3px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--toast-bg);
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      z-index: 2000;
      display: none;
      box-shadow: 0 4px 12px var(--shadow-md);
    }

    .toast.show {
      display: block;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(100px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    /* --- continuous-sync footer --- */
    .continuous-footer {
      max-width: 1600px;
      margin: 0 auto 24px;
      padding: 10px 20px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <div class="settings-wrapper">
          <button class="settings-btn" id="settingsBtn" aria-label="Settings">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
          <div class="settings-dropdown" id="settingsDropdown">
            <div class="settings-item" id="themeToggle">
              <span class="settings-label">Theme</span>
              <span class="settings-value" id="themeLabel">Dark</span>
            </div>
            <div class="settings-divider"></div>
            <div class="settings-item" id="markAllExported">
              <span class="settings-label">Mark all as exported</span>
            </div>
            <div class="settings-item" id="markAllNew">
              <span class="settings-label">Mark all as new</span>
            </div>
            <div class="settings-divider"></div>
            <div class="settings-item" id="settingsOrgId">
              <span class="settings-label">Claude Org ID</span>
              <span class="settings-value settings-org-id" id="orgIdDisplay" title="">Auto-detected</span>
            </div>
            <div class="settings-item" id="editOrgId">
              <span class="settings-label">Edit Org ID</span>
              <span class="settings-value">&#8594;</span>
            </div>
            <div class="settings-divider"></div>
            <div class="settings-item settings-item-has-submenu" id="backupRestore">
              <span class="settings-label">Backup/Restore Database</span>
              <span class="settings-value">&#8594;</span>
              <div class="settings-submenu">
                <div class="settings-item" id="backupData">
                  <span class="settings-label">Export Backup</span>
                </div>
                <div class="settings-item" id="restoreData">
                  <span class="settings-label">Import Backup</span>
                </div>
              </div>
            </div>
            <div class="settings-divider"></div>
            <div class="settings-item" id="advancedOptions">
              <span class="settings-label">Advanced Options</span>
              <span class="settings-value">&#8594;</span>
            </div>
            <input type="file" id="restoreFileBrowse" accept="application/json,.json" style="display: none;">
          </div>
        </div>
        <h1>Scry Sync</h1>
      </div>

      <div class="header-right">
        <div class="conn-status" id="scryConnStatus">Scry: <span class="conn-dot">●</span></div>
      </div>
    </div>

    <div class="source-tabs" id="sourceTabs"></div>

    <div class="controls">
      <div class="search-group">
        <div class="search-box" id="searchBox">
          <input type="text" id="searchInput" placeholder="Search conversations by title...">
          <button class="clear-btn" id="clearSearch">✕</button>
        </div>
        <div class="filter-wrapper">
          <button class="filter-btn" id="filterBtn" title="Filter conversations">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" width="18" height="18">
              <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
            </svg>
          </button>
          <div class="filter-dropdown" id="filterDropdown">
            <div class="filter-option" data-value="all">All conversations</div>
            <div class="filter-option" data-value="new">Needs sync</div>
            <div class="filter-option" data-value="synced">Previously synced</div>
          </div>
        </div>
        <div class="stats" id="stats">Loading...</div>
      </div>

      <div class="action-controls">
        <button class="action-btn" id="syncSelectedBtn" disabled title="Push the selected conversations to Scry">
          Sync selected ›
        </button>
        <button class="action-btn" id="syncRecentBtn" disabled title="Push conversations updated in the last N days to Scry">
          Sync last
        </button>
        <input type="number" id="syncRecentDays" value="7" min="1" max="3650"
               style="width: 56px; padding: 6px; text-align: right;" title="Number of days">
        <span style="color: var(--text-secondary); font-size: 13px;">days ›</span>
        <button class="action-btn" id="reconcileBtn" disabled
                title="Ask Scry which conversations are missing or incompletely captured, and re-sync exactly those">
          Reconcile &amp; sync ›
        </button>
        <button class="action-btn danger" id="deleteFromClaudeBtn" disabled
                title="Delete the SELECTED conversations from Claude — but only after Scry re-verifies each one live (capture complete AND live body matches the archive). Irreversible at Claude; Scry keeps its copy.">
          Delete selected from Claude
        </button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="conversations-table">
      <div id="tableContent">
        <div class="loading">
          <div class="spinner"></div>
          <div id="loadingText">Loading…</div>
        </div>
      </div>
    </div>
  </div>

  <div class="continuous-footer" id="continuousFooter"></div>

  <div class="toast" id="toast"></div>

  <!-- Progress modal for bulk sync/reconcile/delete -->
  <div id="progressModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--modal-overlay); z-index: 3000;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-card); padding: 30px; border-radius: 8px; min-width: 400px; color: var(--text-primary);">
      <h3 style="margin-top: 0; color: var(--text-primary);">Syncing Conversations</h3>
      <div style="margin: 20px 0;">
        <div id="progressText" style="color: var(--text-primary);">Preparing…</div>
        <div style="background: var(--progress-bg); height: 20px; border-radius: 10px; margin-top: 10px; overflow: hidden;">
          <div id="progressBar" style="background: var(--primary-color); height: 100%; width: 0%; transition: width 0.3s;"></div>
        </div>
        <div id="progressStats" style="margin-top: 10px; font-size: 14px; color: var(--text-secondary);"></div>
      </div>
      <button id="cancelExport" style="padding: 8px 16px; background: var(--cancel-btn); color: white; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="scry_sync.js"></script>
  <script src="scry_client.js"></script>
  <script src="chatgpt_adapter.js"></script>
  <script src="sources.js"></script>
  <script src="sync_core.js"></script>
  <script src="dashboard_model.js"></script>
  <script src="browse.js"></script>
</body>
</html>
